<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UML class view — proposed messaging design</title>

<metadata>{&quot;edges&quot;: [{&quot;id&quot;: &quot;uses&quot;, &quot;kind&quot;: &quot;dependency&quot;, &quot;label&quot;: &quot;uses&quot;, &quot;points&quot;: [[300, 150], [370, 150], [440, 150]], &quot;source&quot;: &quot;Publisher&quot;, &quot;target&quot;: &quot;Message&quot;}], &quot;formatVersion&quot;: &quot;0.1&quot;, &quot;id&quot;: &quot;uml-example&quot;, &quot;nodes&quot;: [{&quot;bounds&quot;: [40, 80, 260, 150], &quot;compartments&quot;: [{&quot;lines&quot;: [&quot;publish(message : Message)&quot;], &quot;name&quot;: &quot;operations&quot;}], &quot;id&quot;: &quot;Publisher&quot;, &quot;label&quot;: &quot;Publisher&quot;, &quot;symbol&quot;: &quot;uml.class&quot;}, {&quot;bounds&quot;: [440, 80, 240, 150], &quot;compartments&quot;: [{&quot;lines&quot;: [&quot;text : String&quot;], &quot;name&quot;: &quot;attributes&quot;}], &quot;id&quot;: &quot;Message&quot;, &quot;label&quot;: &quot;Message&quot;, &quot;symbol&quot;: &quot;uml.class&quot;}], &quot;notation&quot;: &quot;uml-2.5.1-class&quot;, &quot;sources&quot;: [], &quot;title&quot;: &quot;UML class view \u2014 proposed messaging design&quot;}</metadata>
<defs>
<marker id="uml-example-open" viewBox="-1 -1 16 12" refX="10" refY="5" markerWidth="16" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse" stroke="#26364a" stroke-width="1.5"><path d="M0 0 L10 5 L0 10" fill="none"/></marker>
<marker id="uml-example-triangle" viewBox="-1 -1 16 12" refX="10" refY="5" markerWidth="16" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse" stroke="#26364a" stroke-width="1.5"><path d="M0 0 L10 5 L0 10 Z" fill="white"/></marker>
<marker id="uml-example-diamond" viewBox="-1 -1 16 12" refX="0" refY="5" markerWidth="16" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse" stroke="#26364a" stroke-width="1.5"><path d="M0 5 L7 0 L14 5 L7 10 Z" fill="#26364a"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" font-size="14" fill="#17263a" xml:space="preserve">
<g id="uml-example-uses" data-model-ref="null"><title>dependency: uses</title><polyline points="300,150 370,150 440,150" fill="none" stroke="#26364a" stroke-width="1.5" marker-end="url(#uml-example-open)" stroke-dasharray="6 4"/>

<text x="52" y="176">publish(message : Message)</text>
</g>
<g id="uml-example-Message" data-model-ref="null"><title>Unbound presentation</title><rect x="440" y="80" width="240" height="150" rx="0" fill="white" stroke="#26364a" stroke-width="1.5"/>
<text x="560.0" y="122" text-anchor="middle" font-weight="bold">Message</text>

<text x="452" y="176">text : String</text>

</g></svg></main><aside id="detail" aria-live="polite">Select an element or connection to inspect its source reference.</aside>
<script>
const svg=document.querySelector('svg');
const diagram=JSON.parse(svg.querySelector('metadata').textContent);
let zoom=100;
function scale(){svg.style.width=zoom+'%';svg.style.maxWidth=(svg.viewBox.baseVal.width*zoom/100)+'px';}
scale();
document.querySelector('#in').onclick=()=>{zoom=Math.min(400,zoom+25);scale()};
document.querySelector('#out').onclick=()=>{zoom=Math.max(25,zoom-25);scale()};
document.querySelector('#fit').onclick=()=>{zoom=100;scale()};
document.querySelectorAll('[data-model-ref]').forEach(n=>{n.onclick=()=>{
    const ref=JSON.parse(n.dataset.modelRef);
    const origin=ref && diagram.sources.find(s=>s.id===ref.source);
    const detail=ref ? {...ref,...(origin ? {source:origin.uri,revision:origin.revision} : {})} : {modelRef:null};
    const native=diagram.extensions && diagram.extensions['mbse-diagrams.native-view'];
    const id=n.id.slice(diagram.id.length+1);
    if(native && native.endpoints[id]){
        detail.ports=Object.fromEntries(Object.entries(native.endpoints[id]).map(([k,v])=>[k,native.ports[v]]));
    }
    document.querySelector('#detail').textContent=JSON.stringify(detail,null,2);
}});
document.querySelector('#download').onclick=()=>{
    const u=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));
    const a=document.createElement('a');a.href=u;a.download='diagram.svg';a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1000);
};
</script></html>
